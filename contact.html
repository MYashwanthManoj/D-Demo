<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Career Cafe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { inter: ['Inter', 'sans-serif'] },
        colors: {
          brand: { 50:'#EFF4FF',100:'#DCE6FF',200:'#BFD0FF',300:'#93AEFF',400:'#6087FB',500:'#3B62F6',600:'#2549E0',700:'#1B37B5',800:'#152C88',900:'#10265E' },
          navy: { 900:'#0F1420',800:'#1E2533',700:'#333B4A',600:'#4E586B',500:'#6B7689',400:'#9AA5BB',300:'#CBD3E1',200:'#E2E7F0',100:'#EEF1F7',50:'#F5F7FB',25:'#FBFCFE' },
        },
      }},
    }
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="font-inter antialiased" style="color:#333B4A;background:#FBFCFE">
  <nav class="fixed top-0 left-0 right-0 z-50" style="background:rgba(251,252,254,0.85);backdrop-filter:blur(16px);border-bottom:1px solid #EEF1F7">
    <div class="max-w-[1200px] mx-auto px-6 h-16 flex items-center justify-between">
      <a href="index.html" style="font-size:17px;line-height:24px;font-weight:600;color:#0F1420">Career Cafe</a>
      <a href="home.html" style="font-size:13px;line-height:20px;font-weight:500;color:#3B62F6">Go to home</a>
    </div>
  </nav>

  <main class="pt-32 pb-20 px-6">
    <div class="max-w-[600px] mx-auto">
      <p style="font-size:11px;line-height:16px;font-weight:500;color:#3B62F6;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px">Contact</p>
      <h1 style="font-size:36px;line-height:44px;font-weight:600;color:#0F1420;margin-bottom:8px">Talk to a person</h1>
      <p style="font-size:17px;line-height:28px;color:#6B7689;margin-bottom:32px">No ticket numbers and no chatbot. Tell us what happened and we will reply within one working day.</p>

      <div class="card p-6">
        <div class="space-y-4">
          <div>
            <label style="font-size:14px;line-height:20px;font-weight:500;color:#333B4A;display:block;margin-bottom:6px">Your name</label>
            <input type="text" placeholder="Priya Sharma" style="width:100%;padding:10px 12px;font-size:15px;color:#333B4A;background:#FFFFFF;border:1px solid #E2E7F0;border-radius:8px;outline:none;font-family:'Inter',sans-serif" />
          </div>
          <div>
            <label style="font-size:14px;line-height:20px;font-weight:500;color:#333B4A;display:block;margin-bottom:6px">Email address</label>
            <input type="email" placeholder="priya.sharma@college.edu" style="width:100%;padding:10px 12px;font-size:15px;color:#333B4A;background:#FFFFFF;border:1px solid #E2E7F0;border-radius:8px;outline:none;font-family:'Inter',sans-serif" />
          </div>
          <div>
            <label style="font-size:14px;line-height:20px;font-weight:500;color:#333B4A;display:block;margin-bottom:6px">Choose a topic</label>
            <select style="width:100%;padding:10px 12px;font-size:15px;color:#333B4A;background:#FFFFFF;border:1px solid #E2E7F0;border-radius:8px;font-family:'Inter',sans-serif">
              <option>Report a broken listing</option>
              <option>Suggest a feature</option>
              <option>Account issue</option>
              <option>Other</option>
            </select>
          </div>
          <div>
            <label style="font-size:14px;line-height:20px;font-weight:500;color:#333B4A;display:block;margin-bottom:6px">Message</label>
            <textarea rows="4" placeholder="Tell us what happened, and which listing or page it involves." style="width:100%;padding:10px 12px;font-size:15px;color:#333B4A;background:#FFFFFF;border:1px solid #E2E7F0;border-radius:8px;outline:none;resize:none;font-family:'Inter',sans-serif"></textarea>
          </div>
          <div>
            <label style="display:flex;align-items:flex-start;gap:8px;cursor:pointer">
              <input type="checkbox" style="margin-top:3px" />
              <span style="font-size:13px;line-height:20px;color:#6B7689">Email me a copy of this message</span>
            </label>
          </div>
          <button class="btn-primary w-full">Send message</button>
        </div>
      </div>
    </div>
  </main>
<script src="personalize.js"></script>
</body>
</html>
